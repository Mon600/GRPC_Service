spring:
  application:
    name: store-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/store_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  web:
    error:
      include-stacktrace: never

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger/index.html

logging:
  level:
    root: INFO
    com.shopapi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{40} - %msg%n"
  file:
    name: logs/shop-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

auth:
  grpc:
    address: ${AUTH_GRPC_ADDRESS:localhost:9090}
    timeout-ms: ${AUTH_GRPC_TIMEOUT_MS:3000}