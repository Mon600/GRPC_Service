name: grpc-service

services:
  store-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STORE_DB_NAME}
      POSTGRES_USER: ${STORE_DB_USER}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD:?Set STORE_DB_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${STORE_DB_PORT}:5432"
    volumes:
      - store-db-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  auth-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  auth:
    build:
      context: .
      dockerfile: src/auth-service/service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the root .env}
      SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in the root .env}
      EXPIRATION_TIME: ${AUTH_TOKEN_EXPIRATION_MS}
      SPRING_GRPC_SERVER_PORT: "9090"
      SPRING_GRPC_SERVER_ADDRESS: "0.0.0.0"
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "127.0.0.1:${AUTH_GRPC_PORT}:9090"
    networks:
      - backend
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      # gRPC-порт слушает TCP; проверка без curl/grpc_health_probe (их нет в образе)
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  store:
    build:
      context: .
      dockerfile: src/store/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://store-db:5432/${STORE_DB_NAME}
      DB_USERNAME: ${STORE_DB_USER}
      DB_PASSWORD: ${STORE_DB_PASSWORD:?Set STORE_DB_PASSWORD in the root .env}
      SERVER_PORT: "8080"
      AUTH_GRPC_ADDRESS: auth:9090
      AUTH_GRPC_TIMEOUT_MS: ${AUTH_GRPC_TIMEOUT_MS}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "${STORE_HTTP_BIND_ADDRESS}:${STORE_HTTP_PORT}:8080"
    networks:
      - backend
    depends_on:
      store-db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  backend:
    driver: bridge

volumes:
  store-db-data:
  auth-db-data:
